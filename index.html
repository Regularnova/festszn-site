<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FESTSZN</title>
<meta name="description" content="FESTSZN builds your festival schedule. Coming soon to iPhone.">
<style>
  :root { --bg: #ffffff; --text: #1a1a1a; --muted: #5c5c5c; --accent: #c8102e; --rule: #e4e4e4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --text: #ececec; --muted: #a8a8a8; --accent: #ff5a6e; --rule: #2e2e2e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.6; }
  main { max-width: 42rem; margin: 0 auto; padding: 18vh 16px 4rem; }
  h1 { font-size: 2.6rem; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
  h1 span { color: var(--accent); }
  .tag { font-size: 1.35rem; margin: .75rem 0 .25rem; }
  p { color: var(--muted); margin: .25rem 0 1rem; }
  footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .95rem; color: var(--muted); }
  a { color: var(--accent); text-underline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>FEST <span>SZN</span></h1>
  <p class="tag">Who needs the full agenda?</p>
  <p>FESTSZN builds <em>your</em> festival schedule: sessions, sets, parties and the people worth meeting. Coming soon to iPhone.</p>
  <footer>
    <a href="privacy-policy.html">Privacy Policy</a> &middot; <a href="mailto:privacy@festszn.com">privacy@festszn.com</a>
  </footer>
</main>
</body>
</html>
